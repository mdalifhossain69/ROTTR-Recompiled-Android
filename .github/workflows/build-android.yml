name: Build ROTTR-Recomp Android APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
  ANDROID_NDK_HOME: /opt/android-sdk/ndk/27.0.12077973
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx2048m'
  # The same persistent keystore must be used for every release.
  KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
  RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p /opt/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          chmod +x /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Accept SDK licenses and install components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses >/dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973" \
            "platform-tools"

      - name: Restore persistent release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret. Refusing to create a new signing key."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing KEYSTORE_PASSWORD secret."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing KEY_ALIAS secret."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD secret."; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Persistent release keystore restored and alias verified."

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android APK
        working-directory: ./android
        run: |
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.0.12077973
          ./gradlew assemble${{ matrix.variant }} \
            -PVERSION_CODE=${{ github.run_number }} \
            -PKEYSTORE_PATH="$KEYSTORE_PATH" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rottr-recomp-${{ matrix.variant }}-apk
          path: android/build/outputs/apk/${{ matrix.variant }}/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify APK output
        run: |
          set -euo pipefail
          APK_DIR="android/build/outputs/apk/${{ matrix.variant }}"
          echo "APK output directory: $APK_DIR"
          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print
          APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | wc -l)
          test "$APK_COUNT" -gt 0 || { echo "::error::No APK was produced"; exit 1; }
          for apk in "$APK_DIR"/*.apk; do
            test -s "$apk" || { echo "::error::APK is empty: $apk"; exit 1; }
            ls -lh "$apk"
            sha256sum "$apk"
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
          done

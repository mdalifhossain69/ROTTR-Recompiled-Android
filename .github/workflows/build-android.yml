name: Build ROTTR Android Debug APK

on:
  workflow_dispatch:

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
  ANDROID_NDK_HOME: /opt/android-sdk/ndk/27.0.12077973
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx2048m'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM assembler (roadmap step 46)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y -qq llvm

      - name: Run host-side graphics translation tests
        run: |
          cmake -S . -B build/host-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host-tests --parallel 2
          ctest --test-dir build/host-tests --output-on-failure

      - name: Build Windows test programs with mingw-w64 (roadmap step 3)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y -qq mingw-w64
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -std=c11 \
            -o tests/windows/rottr-win64-test.exe tests/windows/rottr_win64_test.c
          head -c 2 tests/windows/rottr-win64-test.exe | od -An -tx1 | grep -q '4d 5a'
          ls -lh tests/windows/rottr-win64-test.exe

      - name: Import coverage report (roadmap step 45)
        run: |
          cmake --build build/host-tests --parallel 2 --target rottr_import_report
          ./build/host-tests/rottr_import_report tests/windows/rottr-win64-test.exe | tee /tmp/import-report.txt
          grep -q "Import coverage:" /tmp/import-report.txt
          if [ -f ROTTR.exe ]; then
            ./build/host-tests/rottr_import_report ROTTR.exe | tee /tmp/rottr-import-report.txt
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p /opt/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          chmod +x /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Accept SDK licenses and install components
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973" \
            "platform-tools"

      - name: Cache persistent CI debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rottr-ci-debug-keystore-v1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android debug APK
        working-directory: ./android
        run: |
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.0.12077973
          ./gradlew assembleDebug -PVERSION_CODE=${{ github.run_number }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rottr-recomp-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows test executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: rottr-win64-test-exe
          path: tests/windows/rottr-win64-test.exe
          if-no-files-found: error
          retention-days: 30

      - name: Verify APK output and debug signature
        run: |
          set -euo pipefail
          APK_DIR="android/build/outputs/apk/debug"
          APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | wc -l)
          test "$APK_COUNT" -gt 0 || { echo "::error::No debug APK was produced"; exit 1; }
          for apk in "$APK_DIR"/*.apk; do
            test -s "$apk"
            ls -lh "$apk"
            sha256sum "$apk"
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
          done

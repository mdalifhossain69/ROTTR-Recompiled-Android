// build.gradle for ROTTR-Recomp Android module
// This module builds the native library and Java/Kotlin bridge

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.rottr.recomp'
    compileSdk 34

    defaultConfig {
        applicationId "com.rottr.recomp"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        // Native library configuration
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -Wall -Wextra -Werror"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        
        ndk {
            abiFilters 'arm64-v8a'
        }
        ndkVersion "27.0.12077973"
    }

    signingConfigs {
        release {
            if (project.hasProperty('KEYSTORE_PATH') && project.hasProperty('KEYSTORE_PASSWORD') &&
                project.hasProperty('KEY_ALIAS') && project.hasProperty('KEY_PASSWORD')) {
                storeFile file(project.property('KEYSTORE_PATH'))
                storePassword project.property('KEYSTORE_PASSWORD')
                keyAlias project.property('KEY_ALIAS')
                keyPassword project.property('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}
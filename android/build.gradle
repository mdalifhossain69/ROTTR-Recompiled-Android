// build.gradle for ROTTR-Recomp Android module
// This module builds the native library and Java/Kotlin bridge

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.rottr.recomp'
    compileSdk 34

    defaultConfig {
        applicationId "com.rottr.recomp"
        minSdk 31
        targetSdk 34
        versionCode (project.findProperty('VERSION_CODE') ?: '1').toString().toInteger()
        versionName "1.0"
        
        // Native library configuration
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -Wall -Wextra -Werror"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        
        ndk {
            abiFilters 'arm64-v8a'
        }
        ndkVersion "27.0.12077973"
    }

    signingConfigs {
        release {
            def requiredSigningProperties = ['KEYSTORE_PATH', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
            def hasAllSigningProperties = requiredSigningProperties.every {
                project.hasProperty(it) && !project.property(it).toString().trim().isEmpty()
            }
            // Keep debug builds usable without release credentials. The release task
            // below explicitly fails unless the persistent key is configured.
            if (hasAllSigningProperties) {
                storeFile file(project.property('KEYSTORE_PATH'))
                storePassword project.property('KEYSTORE_PASSWORD')
                keyAlias project.property('KEY_ALIAS')
                keyPassword project.property('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

tasks.register('verifyReleaseSigning') {
    doLast {
        def requiredSigningProperties = ['KEYSTORE_PATH', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
        def missingSigningProperties = requiredSigningProperties.findAll {
            !project.hasProperty(it) || project.property(it).toString().trim().isEmpty()
        }
        if (!missingSigningProperties.isEmpty()) {
            throw new GradleException("Release signing is not configured. Missing: ${missingSigningProperties.join(', ')}. Configure the persistent ROTTR release keystore.")
        }
        def releaseKeystore = file(project.property('KEYSTORE_PATH'))
        if (!releaseKeystore.isFile()) {
            throw new GradleException("Release keystore does not exist: ${releaseKeystore}")
        }
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    dependsOn tasks.named('verifyReleaseSigning')
}
